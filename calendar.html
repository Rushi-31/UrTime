<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar · StudyLog Pro</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/calendar.css"></head><body><div id="app-shell"></div><main class="page"><section class="page-heading"><div><p class="eyebrow">OVERVIEW</p><h1>Study calendar</h1><p>Click a day to see what you worked on.</p></div><div class="month-controls"><button class="icon-button" id="previous-month" aria-label="Previous month"><i class="fa-solid fa-chevron-left"></i></button><strong id="calendar-title"></strong><button class="icon-button" id="next-month" aria-label="Next month"><i class="fa-solid fa-chevron-right"></i></button></div></section><section class="calendar-layout"><article class="card calendar-card"><div class="weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div id="calendar-grid" class="calendar-grid"></div><div class="calendar-legend"><span><i class="legend-low"></i> Under 5h</span><span><i class="legend-mid"></i> 5–8h</span><span><i class="legend-high"></i> 8h+</span></div></article><aside class="card day-detail"><p class="eyebrow">SELECTED DAY</p><h2 id="detail-date">Choose a date</h2><p id="detail-total" class="detail-total">No study logged</p><div id="calendar-detail" class="detail-list"><p class="empty">Select a date in the calendar.</p></div></aside></section></main><script type="module" src="js/calendar.js"></script></body></html>
