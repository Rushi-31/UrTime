<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>History · StudyLog Pro</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/history.css"></head><body><div id="app-shell"></div><main class="page"><section class="page-heading"><div><p class="eyebrow">STUDY LOG</p><h1>Session history</h1><p>Every completed laptop and offline study entry.</p></div><div class="button-row"><button class="button secondary" id="export-csv"><i class="fa-solid fa-file-csv"></i> CSV</button><button class="button secondary" id="export-excel"><i class="fa-solid fa-file-excel"></i> Excel</button><button class="button secondary" id="export-pdf"><i class="fa-solid fa-file-pdf"></i> PDF</button></div></section><section class="card filters"><div class="search-field"><i class="fa-solid fa-magnifying-glass"></i><input id="history-search" placeholder="Search task, remark, or date"></div><div class="filter-tabs" id="history-filter"><button data-range="today" class="active">Today</button><button data-range="week">Week</button><button data-range="month">Month</button><button data-range="all">All time</button></div><label class="date-filter">From <input id="history-from" type="date"></label><label class="date-filter">To <input id="history-to" type="date"></label></section><section class="history-columns"><article class="card"><div class="section-head"><div><p class="eyebrow">LAPTOP</p><h2>Focused sessions</h2></div><span id="laptop-total" class="pill">0 entries</span></div><div class="table-wrap"><table><thead><tr><th>Task</th><th>Start</th><th>End</th><th>Duration</th><th>Date</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody id="laptop-history"></tbody></table></div></article><article class="card"><div class="section-head"><div><p class="eyebrow">OFFLINE</p><h2>Manual top-ups</h2></div><span id="offline-total" class="pill">0 entries</span></div><div class="table-wrap"><table><thead><tr><th>Remark</th><th>Start</th><th>End</th><th>Duration</th><th>Date</th></tr></thead><tbody id="offline-history"></tbody></table></div></article></section></main><script type="module" src="js/history.js"></script></body></html>
